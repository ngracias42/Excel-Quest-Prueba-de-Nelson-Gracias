<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel Quest</title>
<style>
:root{--bg:#f3f6f2;--card:#fff;--ink:#1c2a22;--mut:#5d6f63;--line:#cfdacf;--acc:#1d6f42;--accb:#e3f1e8;--ok:#1d6f42;--bad:#b3261e;--hl:#fff3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--ink:#e8f0ea;--mut:#9fb2a6;--line:#2f4036;--acc:#4fc17f;--accb:#203a2a;--ok:#4fc17f;--bad:#ff8a80;--hl:#5a4d10}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--ink:#e8f0ea;--mut:#9fb2a6;--line:#2f4036;--acc:#4fc17f;--accb:#203a2a;--ok:#4fc17f;--bad:#ff8a80;--hl:#5a4d10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0}
.pts{font-weight:600;color:var(--acc)}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.tabs button.on{border-color:var(--acc);background:var(--accb);font-weight:600}
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--acc)}.dots i.cur{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{margin:0 0 6px;font-size:20px}
.story{margin:0 0 14px;color:var(--mut)}
.wrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;font:14px Consolas,"Courier New",monospace;min-width:100%}
th,td{border:1px solid var(--line);padding:5px 10px;min-width:70px;height:30px;text-align:left}
th{background:var(--accb);color:var(--mut);font-weight:600;text-align:center}
th.r{min-width:34px;width:34px}
td.t{background:var(--hl);font-weight:700}
.bar{display:flex;align-items:center;gap:8px;border:2px solid var(--acc);border-radius:8px;padding:4px 8px;background:var(--card)}
.bar b{color:var(--acc);font:600 14px Consolas,monospace;min-width:34px}
.bar input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:16px Consolas,"Courier New",monospace;padding:6px 0;min-width:0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.row button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:root[data-theme="dark"] .row button.p{color:#0b1a11}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row button.p{color:#0b1a11}}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin-top:12px;min-height:24px;font-weight:600}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}#msg.n{color:var(--mut);font-weight:400}
code{font-family:Consolas,monospace;background:var(--accb);padding:1px 5px;border-radius:4px}
.tip{color:var(--mut);font-size:14px;margin-top:14px}
.app{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:16px}
@media(max-width:640px){.app{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:6px}
nav button{padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;text-align:left}
nav button.on{border-color:var(--acc);background:var(--accb);font-weight:600}
nav button:disabled{opacity:.55;cursor:default}
nav small{color:var(--mut);font-weight:400;display:block}
#guide ul{padding-left:20px}#guide li{margin:6px 0}
.opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:var(--accb)}
.opt input{margin-right:8px}
[hidden]{display:none!important}
#tpl a{color:var(--acc);font-weight:600}#tpl p{margin:0 0 14px}
</style>
</head>
<body>
<main>
<header><h1>Excel Quest</h1><span class="pts" id="pts"></span></header>

 function C(){let l=A();while(isO("=","<>","<",">","<=",">=")){const o=T[p++].v;l=cmp(l,o,A())}return l}

 function M(){let l=P();while(isO("*","/")){const o=T[p++].v,r=P();l=o=="*"?num(l)*num(r):num(l)/num(r);if(!isFinite(l))throw 0}return l}
 function P(){let l=U();if(isO("^")){p++;l=Math.pow(num(l),num(P()))}return l}
 function U(){if(isO("-")){p++;return -num(U())}if(isO("+")){p++;return num(U())}return V()}
 function V(){const t=T[p++];if(!t)throw 0;
  if(t.k=="n"||t.k=="s")return t.v;
  if(t.k=="o"&&t.v=="("){const v=C();if(!isO(")"))throw 0;p++;return v}
  if(t.k=="i"){
   if(isO("(")){p++;if(t.v=="SI.ERROR"||t.v=="IFERROR"){let v,p0=p;try{v=C()}catch(x){v=undefined;p=p0;let d=0;while(p<T.length&&!(d==0&&isO(";",","))){if(isO("("))d++;if(isO(")"))d--;p++}}if(!isO(";",","))throw 0;p++;const w=C();if(!isO(")"))throw 0;p++;return v===undefined?w:v}
   const f=F[t.v];if(!f)throw 0;const a=[];if(isO(")")){p++}else{for(;;){a.push(C());if(isO(";",",")){p++;continue}if(isO(")")){p++;break}throw 0}}return f(a)}
   if(t.v=="FALSO"||t.v=="FALSE")return false;if(t.v=="VERDADERO"||t.v=="TRUE")return true;if(!/^[A-Z]+\d+$/.test(t.v))throw 0;
   if(isO(":")){p++;const e=T[p++];if(!e||!/^[A-Z]+\d+$/.test(e.v))throw 0;return rng(t.v,e.v,get)}
   return get(t.v)}
  throw 0}
 const v=C();if(p<T.length)throw 0;return v}
function rng(a,b,get){const pa=/([A-Z]+)(\d+)/.exec(a),pb=/([A-Z]+)(\d+)/.exec(b),o=[];
 for(let r=+pa[2];r<=+pb[2];r++)for(let c=pa[1].charCodeAt(0);c<=pb[1].charCodeAt(0);c++)o.push(get(String.fromCharCode(c)+r));o.w=pb[1].charCodeAt(0)-pa[1].charCodeAt(0)+1;return o}
const cur=()=>L[lv].ex[ix],key=()=>L[lv].id+"-"+ix;
function msg(t,c){const m=$("msg");m.textContent=t;m.className=c}
let view="home";
function show(v){view=v;["home","guide","tpl","game"].forEach(x=>$(x).hidden=x!=v);menu()}
function menu(){
 $("pts").textContent=pts+" puntos";
 $("menu").innerHTML='<button data-h="1" class="'+(view=="home"?"on":"")+'">🏠 Inicio</button>'+L.map((l,i)=>{const n=l.ex.filter((_,j)=>done[l.id+"-"+j]).length;return `<button data-i="${i}" class="${i==lv&&view!="home"&&view!="tpl"?"on":""}">${l.n}<small>${n}/${l.ex.length} ejercicios</small></button>`}).join("")+'<button data-t="1" class="'+(view=="tpl"?"on":"")+'">📁 Plantillas<small>4 descargables</small></button>';
 $("menu").querySelectorAll("button:not([disabled])").forEach(b=>b.onclick=()=>{if(b.dataset.h)return home();if(b.dataset.t)return tpl();lv=+b.dataset.i;guide()})}
const TP=[["presupuesto-mensual","Presupuesto mensual","Ingresos y gastos del mes, con saldo y % gastado. Va bien con el Nivel 7."],["inventario","Control de inventario","Valor total y aviso de productos por reponer. Va bien con los Niveles 1 y 3."],["registro-de-notas","Registro de notas","Promedios y aprobados o reprobados. Va bien con los Niveles 2 y 3."],["control-de-ventas","Control de ventas","Total por venta y por vendedor. Va bien con el Nivel 5."]];
function tpl(){$("tpl").innerHTML='<h2>Plantillas descargables</h2><p class="story">Archivos .xlsx con fórmulas y filas de ejemplo. Las celdas amarillas son las que llenas. Para usarlas en Excel Online, súbelas a OneDrive y ábrelas con Excel en línea.</p>'+TP.map(p=>`<p><b>${p[1]}</b><br>${p[2]}<br><a href="${p[0]}.xlsx" download>⬇ Descargar</a></p>`).join("");show("tpl")}
function home(){$("home").innerHTML='<h2>Aprende Excel jugando</h2><p class="story">Cada nivel tiene una guía corta y ejercicios con casos reales. ¿Por dónde empiezas?</p><div class="row"><button class="p" id="h0">Empiezo de cero</button><button id="h1">Ya sé lo básico</button></div>';$("h0").onclick=()=>{lv=0;guide()};$("h1").onclick=()=>{lv=1;guide()};show("home")}
function guide(){const l=L[lv];$("guide").innerHTML=`<h2>${l.n}</h2>${GD[l.id]}<div class="row"><button class="p" id="go">Empezar a jugar</button></div>`;show("guide");$("go").onclick=()=>{ix=l.ex.findIndex((_,j)=>!done[l.id+"-"+j]);if(ix<0)ix=0;load()}}
function draw(){
 menu();const e=cur();
 $("dots").innerHTML=L[lv].ex.map((_,j)=>`<i class="${done[L[lv].id+"-"+j]?"done":""} ${j==ix?"cur":""}"></i>`).join("");
 $("t").textContent=e.t;$("s").textContent=e.s;$("cn").textContent=e.c||"fx";
 const q=!!e.o;$("bar").hidden=q;$("opts").hidden=!q;$("g").parentNode.hidden=!e.g;
 if(e.g){const w=Math.max(...e.g.map(r=>r.length));
 let h="<tr><th class='r'></th>"+Array.from({length:w},(_,i)=>`<th>${col(i)}</th>`).join("")+"</tr>";
 e.g.forEach((r,ri)=>{h+=`<tr><th class="r">${ri+1}</th>`+Array.from({length:w},(_,ci)=>{const id=col(ci)+(ri+1),v=r[ci];return `<td id="c${id}" class="${id==e.c?"t":""}">${v===null||v===undefined?"":v}</td>`}).join("")+"</tr>"});
 $("g").innerHTML=h}}
function load(){hint=sol=false;const e=cur();$("f").value="";$("nx").hidden=true;$("ck").hidden=false;
 $("opts").innerHTML=e.o?e.o.map((o,i)=>[o,i]).sort(()=>Math.random()-.5).map(([o,i])=>`<label class="opt"><input type="radio" name="o" value="${i}">${o}</label>`).join(""):"";
 show("game");msg(e.o?"Elige la respuesta correcta.":"Escribe tu fórmula en la celda amarilla "+e.c+".","n");draw();if(!e.o)$("f").focus()}
function get(id){const m=/([A-Z]+)(\d+)/.exec(id),r=cur().g[+m[2]-1];if(!r)return null;const v=r[m[1].charCodeAt(0)-65];return v===undefined?null:dsr(v)}
$("ck").onclick=check;$("f").onkeydown=e=>{if(e.key=="Enter")check()};
function check(){
 const e=cur();
 if(e.o){const x=document.querySelector("input[name=o]:checked");if(!x)return msg("Elige una opción.","bad");if(+x.value!==e.a)return msg("No es esa. Mira la pista e inténtalo otra vez.","bad");return win(e)}
 const f=$("f").value.trim();
 if(!f)return msg("Escribe una fórmula primero.","bad");
 if(f[0]!="=")return msg("Toda fórmula empieza con el signo =","bad");
 if(!/[A-Za-z]+\d+/.test(f))return msg("Usa las celdas (como B2) en lugar de escribir los números a mano.","bad");
 let r;try{r=ev(f.slice(1),get)}catch(x){return msg("Hay un error en la fórmula. Revisa paréntesis, comillas y nombres de funciones.","bad")}
 if(e.need&&!e.need.test(f))return msg("El resultado puede salir bien, pero en este ejercicio practica la función indicada. Mira la pista.","bad");
 const ok=typeof e.a=="number"?(typeof r=="number"&&Math.abs(r-e.a)<1e-6):(e.cs?String(r)==e.a:String(r).toLowerCase()==e.a.toLowerCase());
 if(!ok)return msg("Tu fórmula da "+(typeof r=="number"?+r.toFixed(4):'"'+r+'"')+". No es el resultado esperado, inténtalo otra vez.","bad");
 win(e,r)}
function win(e,r){
 if(!done[key()]){done[key()]=1;pts+=sol?0:hint?5:10;save()}
 const last=ix==L[lv].ex.length-1;
 msg(last?"¡Correcto! Terminaste el "+L[lv].n.split(" ·")[0]+".":"¡Correcto!","ok");
 $("pts").textContent=pts+" puntos";draw();if(e.c&&r!==undefined)$("c"+e.c).textContent=r;
 $("ck").hidden=true;$("nx").hidden=false;$("nx").textContent=last?(lv<L.length-1?"Ir al siguiente nivel":"Repetir nivel"):"Siguiente"}
$("nx").onclick=()=>{if(ix<L[lv].ex.length-1)ix++;else if(lv<L.length-1){lv++;return guide()}else ix=0;load()};
$("hb").onclick=()=>{hint=true;msg("Pista: "+cur().h,"n")};
$("sb").onclick=()=>{const e=cur();sol=true;if(e.o){document.querySelector("input[name=o][value='"+e.a+"']").checked=true;msg("Respuesta marcada. Pulsa Comprobar (sin puntos).","n")}else{$("f").value=e.sol;msg("Solución cargada. Pulsa Comprobar para verla funcionar (sin puntos).","n")}};
$("gb").onclick=guide;home();
</script>
